<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Voltz Dashboard</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
* { box-sizing: border-box; margin:0; padding:0; font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; }
body { display: flex; height: 100vh; background: #0f172a; color: #e5e7eb; }
#sidebar { width: 260px; background: #020617; border-right: 1px solid #1e293b; padding: 16px; display: flex; flex-direction: column; }
#userBox { display: none; align-items: center; gap: 12px; margin-bottom: 20px; }
#userBox img { width: 40px; height: 40px; border-radius: 50%; }
#fileList { flex: 1; overflow-y: auto; }
.file { padding: 8px 10px; border-radius: 6px; cursor: pointer; }
.file:hover { background: #1e293b; }
.file.active { background: #2563eb; }
#main { flex: 1; display: flex; flex-direction: column; padding: 16px; }
#editor { flex: 1; background: #1e293b; border-radius: 6px; padding: 8px; color:#e5e7eb; font-family: monospace; font-size: 14px; overflow-y:auto; }
header { display:flex; justify-content: space-between; align-items: center; margin-bottom:8px; }
button { padding:6px 12px; border:none; border-radius:4px; cursor:pointer; background:#2563eb; color:white; margin-right:4px; }
button:hover { background:#1e40af; }
input { padding:6px 8px; border-radius:4px; border:none; margin-right:8px; width: 150px; }
#controls { display:flex; align-items:center; }
</style>
</head>
<body>
<div id="sidebar">
  <div id="userBox">
    <img id="userImg" src="" alt="Profile"/>
    <span id="userName"></span>
  </div>
  <div id="fileList"></div>
</div>
<div id="main">
  <header>
    <div id="controls">
      <input type="text" id="slugInput" placeholder="Project slug (e.g., hehe)"/>
      <button id="loadBtn">Load</button>
      <button id="saveBtn">Save</button>
    </div>
    <div id="loginContainer"></div>
  </header>
  <div id="editor" contenteditable="true" spellcheck="false">// Your code here...</div>
</div>

<script>
const BACKEND_URL = "https://your-render-service.onrender.com"; // Replace with your Render URL
let googleToken = null;
let projects = [];
let activeSlug = null;

// --- Google Sign In ---
function handleCredentialResponse(response) {
  googleToken = response.credential;
  fetch(`${BACKEND_URL}/google_login`, {
    method: "POST",
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({google_token: googleToken})
  })
  .then(res=>res.json())
  .then(data=>{
    if(data.status==="success"){
      document.getElementById("userBox").style.display="flex";
      document.getElementById("userImg").src = data.picture;
      document.getElementById("userName").textContent = data.name;
      document.getElementById("loginContainer").style.display="none";
      loadProjects(); // fetch projects on login
    }
  });
}

window.onload = function(){
  google.accounts.id.initialize({
    client_id: "961329435710-8em8oamovd45m21ot7v5aeoop3jf6lce.apps.googleusercontent.com",
    callback: handleCredentialResponse
  });
  google.accounts.id.renderButton(
    document.getElementById("loginContainer"),
    { theme: "outline", size: "large" }
  );
  google.accounts.id.prompt();
};

// --- Load All Projects ---
function loadProjects(){
  fetch(`${BACKEND_URL}/projects`, {
    headers: { 'Authorization': `Bearer ${googleToken}` }
  })
  .then(res=>res.json())
  .then(data=>{
    projects = data;
    renderSidebar();
  });
}

// --- Render Sidebar ---
function renderSidebar(){
  const fileList = document.getElementById("fileList");
  fileList.innerHTML = "";
  projects.forEach(p=>{
    const div = document.createElement("div");
    div.className="file";
    div.textContent=p.slug;
    if(p.slug===activeSlug) div.classList.add("active");
    div.onclick=()=>{
      activeSlug = p.slug;
      document.getElementById("slugInput").value = p.slug;
      document.getElementById("editor").textContent = p.content;
      renderSidebar();
    };
    fileList.appendChild(div);
  });
}

// --- Save Project ---
document.getElementById("saveBtn").onclick = ()=>{
  const slug = document.getElementById("slugInput").value.trim();
  const content = document.getElementById("editor").textContent;
  if(!slug || !googleToken) return alert("Sign in and enter a slug.");

  fetch(`${BACKEND_URL}/projects`, {
    method:"POST",
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({google_token: googleToken, slug, content})
  })
  .then(res=>res.json())
  .then(data=>{
    if(data.status==="success"){
      const existing = projects.find(p=>p.slug===slug);
      if(existing){
        existing.content = content; // auto-replace
      } else {
        projects.push({slug, content});
      }
      activeSlug = slug;
      renderSidebar();
      alert("Saved successfully!");
    } else {
      alert("Save failed!");
    }
  });
};

// --- Load Selected Project ---
document.getElementById("loadBtn").onclick = ()=>{
  const slug = document.getElementById("slugInput").value.trim();
  if(!slug || !googleToken) return alert("Sign in and enter a slug.");
  const project = projects.find(p=>p.slug===slug);
  if(project){
    document.getElementById("editor").textContent = project.content;
    activeSlug = slug;
    renderSidebar();
  } else {
    alert("Project not found. You can create it by typing content and clicking Save.");
  }
};
</script>
</body>
</html>
