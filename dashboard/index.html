<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Voltz Dashboard</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
* { box-sizing: border-box; margin:0; padding:0; font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; }
body { display: flex; height: 100vh; background: #0f172a; color: #e5e7eb; }
#sidebar { width: 260px; background: #020617; border-right: 1px solid #1e293b; padding: 16px; display: flex; flex-direction: column; }
#userBox { display: none; align-items: center; gap: 12px; margin-bottom: 20px; }
#userBox img { width: 40px; height: 40px; border-radius: 50%; }
#fileList { flex: 1; overflow-y: auto; margin-bottom: 8px; }
.file { padding: 8px 10px; border-radius: 6px; cursor: pointer; }
.file:hover { background: #1e293b; }
.file.active { background: #2563eb; }
#main { flex: 1; display: flex; flex-direction: column; padding: 16px; }
#editor { flex: 1; background: #1e293b; border-radius: 6px; padding: 8px; color:#e5e7eb; font-family: monospace; font-size: 14px; overflow-y:auto; white-space: pre-wrap; }
header { display:flex; justify-content: space-between; align-items: center; margin-bottom:8px; flex-wrap: wrap; }
button { padding:6px 12px; border:none; border-radius:4px; cursor:pointer; background:#2563eb; color:white; margin-right:4px; margin-top:4px; }
button:hover { background:#1e40af; }
input[type=text] { padding:6px 8px; border-radius:4px; border:none; margin-right:4px; margin-top:4px; width:150px; }
#controls { display:flex; flex-wrap: wrap; align-items:center; }
</style>
</head>
<body>
<div id="sidebar">
  <div id="userBox">
    <img id="userImg" src="" alt="Profile"/>
    <span id="userName"></span>
  </div>
  <div id="fileList"></div>
  <button id="newFileBtn">New File</button>
  <button id="uploadFileBtn">Upload File</button>
  <input type="file" id="uploadFileInput" style="display:none;" />
  <button id="saveFilesSidebarBtn">Save Files to Sidebar</button>
</div>
<div id="main">
  <header>
    <div id="controls">
      <input type="text" id="slugInput" placeholder="File name"/>
      <button id="loadBtn">Load</button>
      <button id="saveBtn">Save</button>
      <button id="saveAsBtn">Save As</button>
      <button id="deployBtn">Deploy To Voltz Pages</button>
    </div>
    <div id="loginContainer"></div>
  </header>
  <div id="editor" contenteditable="true" spellcheck="false">// Your code here...</div>
</div>

<script>
const BACKEND_URL = "https://your-render-service.onrender.com"; // Replace with your Render URL
let googleToken = null;
let currentProject = null; // currently loaded project name
let files = []; // files linked to current project
let activeFile = null;

// --- Google Sign In ---
function handleCredentialResponse(response){
  googleToken = response.credential;
  fetch(`${BACKEND_URL}/google_login`,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({google_token:googleToken})
  }).then(res=>res.json()).then(data=>{
    if(data.status==='success'){
      document.getElementById('userBox').style.display='flex';
      document.getElementById('userImg').src=data.picture;
      document.getElementById('userName').textContent=data.name;
      document.getElementById('loginContainer').style.display='none';
    }
  });
}

window.onload = function(){
  google.accounts.id.initialize({
    client_id:"961329435710-8em8oamovd45m21ot7v5aeoop3jf6lce.apps.googleusercontent.com",
    callback:handleCredentialResponse
  });
  google.accounts.id.renderButton(document.getElementById("loginContainer"),{theme:"outline", size:"large"});
  google.accounts.id.prompt();
};

// --- Sidebar Rendering ---
function renderSidebar(){
  const fileList = document.getElementById('fileList');
  fileList.innerHTML='';
  files.forEach(f=>{
    const div=document.createElement('div');
    div.className='file';
    div.textContent=f.slug;
    if(f.slug===activeFile) div.classList.add('active');
    div.onclick=()=>{
      activeFile=f.slug;
      document.getElementById('slugInput').value=f.slug;
      document.getElementById('editor').textContent=f.content;
      renderSidebar();
    };
    fileList.appendChild(div);
  });
}

// --- Save Project File ---
function saveFile(slug, content){
  if(!slug || !currentProject) return alert("Pick a file name and project first.");
  fetch(`${BACKEND_URL}/projects`,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({google_token:googleToken, project:currentProject, slug, content})
  }).then(res=>res.json()).then(data=>{
    if(data.status==='success'){
      const existing = files.find(f=>f.slug===slug);
      if(existing) existing.content = content;
      else files.push({slug, content});
      activeFile = slug;
      renderSidebar();
    } else alert('Save failed!');
  });
}

// --- Load File ---
document.getElementById('loadBtn').onclick=()=>{
  const slug = document.getElementById('slugInput').value.trim();
  const file = files.find(f=>f.slug===slug);
  if(file){
    activeFile=slug;
    document.getElementById('editor').textContent=file.content;
    renderSidebar();
  } else alert("File not found in this project.");
};

// --- Save ---
document.getElementById('saveBtn').onclick=()=>{
  let slug=document.getElementById('slugInput').value.trim();
  if(!slug){
    slug=prompt("Enter file name:");
    if(!slug) return;
    document.getElementById('slugInput').value=slug;
  }
  const content=document.getElementById('editor').textContent;
  saveFile(slug,content);
};

// --- Save As ---
document.getElementById('saveAsBtn').onclick=()=>{
  const slug=prompt("Save file as (with extension):");
  if(!slug) return;
  document.getElementById('slugInput').value=slug;
  const content=document.getElementById('editor').textContent;
  saveFile(slug,content);
};

// --- New File ---
document.getElementById('newFileBtn').onclick=()=>{
  const slug=prompt("Enter new file name:");
  if(!slug) return;
  activeFile=slug;
  document.getElementById('slugInput').value=slug;
  document.getElementById('editor').textContent='// Your code here...';
  files.push({slug, content:'// Your code here...'});
  renderSidebar();
};

// --- Upload File ---
document.getElementById('uploadFileBtn').onclick=()=>document.getElementById('uploadFileInput').click();
document.getElementById('uploadFileInput').onchange=function(e){
  const file=e.target.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=function(ev){
    const slug=file.name;
    const content=ev.target.result;
    activeFile=slug;
    document.getElementById('slugInput').value=slug;
    document.getElementById('editor').textContent=content;
    saveFile(slug,content);
  };
  reader.readAsText(file);
};

// --- Save Files to Sidebar ---
document.getElementById('saveFilesSidebarBtn').onclick=()=>{
  files.forEach(f=>saveFile(f.slug,f.content));
  alert('All files saved to sidebar/project!');
};

// --- Deploy To Voltz Pages ---
document.getElementById('deployBtn').onclick = ()=>{
  if(!currentProject){
    const projName = prompt("Enter project name for deployment:");
    if(!projName) return;
    currentProject = projName;
  }

  // Auto-save all files first
  files.forEach(f=>saveFile(f.slug,f.content));

  // Deploy via backend
  fetch(`${BACKEND_URL}/deploy_github`,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({google_token:googleToken, project:currentProject, files})
  }).then(res=>res.json()).then(data=>{
    if(data.status==='success') alert(`Project "${currentProject}" deployed to Voltz Pages!`);
    else alert("Deployment failed: "+(data.message || "Unknown error"));
  });
};
</script>
</body>
</html>
