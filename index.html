<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voltz</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #5cc6ff, #1e3fa9);
      color: white;
    }

    /* Header */
    header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 24px 32px;
    }

    header img {
      height: 42px;
    }

    .cta-button {
      margin-left: 12px;
      padding: 10px 20px;
      border-radius: 999px;
      border: none;
      background: white;
      color: #1e3fa9;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none; /* For <a> */
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .cta-button:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
    }

    /* Main Section */
    main {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - 100px);
      padding: 0 32px;
      text-align: center;
    }

    h1 {
      font-size: clamp(2.5rem, 6vw, 4rem);
      font-weight: 700;
      max-width: 700px;
      line-height: 1.1;
    }
  </style>
</head>
<body>

  <header>
    <img src="logo.png" alt="Voltz Logo" />
    <!-- Fixed Get Started button -->
    <a href="/auth.html" class="cta-button">Get Started</a>
  </header>

  <main>
    <h1>Turn your ideas to reality</h1>
  </main>

</body>
</html>
