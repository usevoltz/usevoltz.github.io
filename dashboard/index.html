<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Voltz Dashboard</title>

<script src="https://accounts.google.com/gsi/client" async defer></script>

<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  background: #0f172a;
  color: #e5e7eb;
  display: flex;
  height: 100vh;
}

/* Sidebar */
#sidebar {
  width: 260px;
  background: #020617;
  border-right: 1px solid #1e293b;
  padding: 16px;
  display: flex;
  flex-direction: column;
}
#userBox {
  display: none;
  align-items: center;
  gap: 12px;
  margin-bottom: 20px;
}
#userBox img {
  width: 40px;
  height: 40px;
  border-radius: 50%;
}
#fileList {
  flex: 1;
  overflow-y: auto;
  margin-top: 12px;
}
.file {
  padding: 8px 10px;
  border-radius: 6px;
  cursor: pointer;
}
.file:hover { background: #1e293b; }
.file.active { background: #2563eb; }

/* Main */
#main {
  flex: 1;
  display: flex;
  flex-direction: column;
}
header {
  padding: 16px 24px;
  border-bottom: 1px solid #1e293b;
  display: flex;
  align-items: center;
  gap: 12px;
}
header input {
  background: #020617;
  border: 1px solid #1e293b;
  color: #e5e7eb;
  padding: 8px 12px;
  border-radius: 8px;
  flex: 1;
}
header button {
  background: #2563eb;
  border: none;
  color: white;
  padding: 8px 14px;
  border-radius: 8px;
  cursor: pointer;
}
header button:hover { background: #1d4ed8; }

#editor {
  flex: 1;
  padding: 16px;
}
textarea {
  width: 100%;
  height: 100%;
  background: #020617;
  border: 1px solid #1e293b;
  color: #e5e7eb;
  font-family: monospace;
  font-size: 14px;
  padding: 12px;
  border-radius: 12px;
  resize: none;
}
</style>
</head>

<body>

<!-- Sidebar -->
<div id="sidebar">
  <div id="userBox">
    <img id="userPic" />
    <div>
      <div id="userName"></div>
      <small style="opacity:.6">Google account</small>
    </div>
  </div>

  <button onclick="addFile()">+ New File</button>
  <div id="fileList"></div>

  <div id="gSignIn">
    <div id="g_id_onload"
      data-client_id="961329435710-8em8oamovd45m21ot7v5aeoop3jf6lce.apps.googleusercontent.com"
      data-callback="handleCredentialResponse"
      data-auto_prompt="false">
    </div>
    <div class="g_id_signin" data-type="standard"></div>
  </div>
</div>

<!-- Main -->
<div id="main">
  <header>
    <input id="projectName" placeholder="Project Folder / URL" />
    <button onclick="saveProject()">Save Project</button>
    <button onclick="loadProjects()">Load Projects</button>
  </header>
  <div id="editor">
    <textarea id="fileContent" placeholder="Select a file to edit..."></textarea>
  </div>
</div>

<script>
const BACKEND_URL = "https://backend-u6to.onrender.com"; // Replace with your backend

let googleToken = null;
let userLoggedIn = false;
let files = [];
let currentFileIndex = -1;

// Google login callback
function handleCredentialResponse(response){
  googleToken = response.credential;

  fetch(`${BACKEND_URL}/google_login`, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({google_token: googleToken})
  })
  .then(r=>r.json())
  .then(data=>{
    if(data.status === 'success'){
      userLoggedIn = true;
      document.getElementById('userBox').style.display='flex';
      document.getElementById('userName').innerText = data.name || data.email;
      if(data.picture) document.getElementById('userPic').src = data.picture;
    } else {
      alert("Google login failed: "+(data.error||"unknown"));
    }
  });
}

// Add a new file
function addFile(){
  if(!userLoggedIn){ alert("Sign in first"); return; }
  const name = prompt("Enter new file name (e.g. index.html):");
  if(!name) return;
  files.push({name, content:""});
  currentFileIndex = files.length-1;
  renderFileList();
  loadCurrentFile();
}

// Render sidebar file list
function renderFileList(){
  const div = document.getElementById('fileList');
  div.innerHTML = '';
  files.forEach((f,i)=>{
    const el = document.createElement('div');
    el.className = 'file'+(i===currentFileIndex?' active':'');
    el.innerText = f.name;
    el.onclick = ()=>{currentFileIndex=i; loadCurrentFile(); renderFileList();}
    div.appendChild(el);
  });
}

// Load currently selected file into editor
function loadCurrentFile(){
  if(currentFileIndex <0 || !files[currentFileIndex]) return;
  document.getElementById('fileContent').value = files[currentFileIndex].content;
}

// Save editor content into file array
document.getElementById('fileContent').addEventListener('input', ()=>{
  if(currentFileIndex>=0 && files[currentFileIndex]){
    files[currentFileIndex].content = document.getElementById('fileContent').value;
  }
});

// Save project
function saveProject(){
  if(!userLoggedIn){ alert("Sign in first"); return; }
  const projectName = document.getElementById('projectName').value.trim();
  if(!projectName){ alert("Enter project folder name"); return; }
  if(files.length===0){ alert("Add at least one file"); return; }

  fetch(`${BACKEND_URL}/save_project`, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({google_token: googleToken, project_name: projectName, files})
  })
  .then(r=>r.json())
  .then(data=>{
    if(data.file_urls) alert("Saved!\n"+data.file_urls.join("\n"));
    else alert("Error: "+(data.error||"unknown"));
  });
}

// Load projects
function loadProjects(){
  if(!userLoggedIn){ alert("Sign in first"); return; }
  fetch(`${BACKEND_URL}/list_projects`,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({google_token: googleToken})
  })
  .then(r=>r.json())
  .then(data=>{
    if(!data.projects || !data.projects.length){ alert("No projects found"); return; }
    const proj = prompt("Select a project:\n"+data.projects.map(p=>p.name).join("\n"));
    const selected = data.projects.find(p=>p.name===proj);
    if(!selected) return alert("Invalid project");
    alert("Project loaded! You can add files manually now (backend doesn't send file contents).");
  });
}
</script>

</body>
</html>
