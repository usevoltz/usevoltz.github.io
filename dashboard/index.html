<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Voltz Dashboard</title>

<script src="https://accounts.google.com/gsi/client" async defer></script>

<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  background: #0f172a;
  color: #e5e7eb;
  display: flex;
  height: 100vh;
}

/* Sidebar */
#sidebar {
  width: 260px;
  background: #020617;
  border-right: 1px solid #1e293b;
  padding: 16px;
  display: flex;
  flex-direction: column;
}
#userBox {
  display: none;
  align-items: center;
  gap: 12px;
  margin-bottom: 20px;
}
#userBox img {
  width: 40px;
  height: 40px;
  border-radius: 50%;
}
#fileList {
  flex: 1;
  overflow-y: auto;
}
.file {
  padding: 8px 10px;
  border-radius: 6px;
  cursor: pointer;
}
.file:hover { background: #1e293b; }
.file.active { background: #2563eb; }

/* Main */
#main {
  flex: 1;
  display: flex;
  flex-direction: column;
}
header {
  padding: 16px;
  border-bottom: 1px solid #1e293b;
}

/* Google button */
#googleSignIn {
  margin-top: 20px;
}
</style>
</head>
<body>

<div id="sidebar">
  <!-- User info -->
  <div id="userBox">
    <img id="userPic" src="" alt="User Picture">
    <span id="userName"></span>
  </div>

  <!-- File list -->
  <div id="fileList">
    <div class="file">File 1</div>
    <div class="file">File 2</div>
  </div>

  <!-- Google Sign-In button -->
  <div id="googleSignIn"></div>
</div>

<div id="main">
  <header>
    <h1>Voltz Dashboard</h1>
  </header>
  <div id="content"></div>
</div>

<script>
function handleCredentialResponse(response) {
  // Decode the ID token
  const data = jwt_decode(response.credential);

  // Show user info
  document.getElementById('userPic').src = data.picture;
  document.getElementById('userName').innerText = data.name;
  document.getElementById('userBox').style.display = 'flex';

  // Hide Google Sign-In button
  document.getElementById('googleSignIn').style.display = 'none';
}

// Initialize Google Sign-In
window.onload = function () {
  google.accounts.id.initialize({
    client_id: '961329435710-8em8oamovd45m21ot7v5aeoop3jf6lce.apps.googleusercontent.com',
    callback: handleCredentialResponse
  });

  google.accounts.id.renderButton(
    document.getElementById('googleSignIn'),
    { theme: 'outline', size: 'large', width: 200 }
  );

  google.accounts.id.prompt(); // Show the One Tap prompt
};
</script>

<!-- JWT decode library -->
<script src="https://cdn.jsdelivr.net/npm/jwt-decode@3.1.2/build/jwt-decode.min.js"></script>

</body>
</html>
