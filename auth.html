<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Voltz – Auth</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #5cc6ff, #1e3fa9);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }

    .auth-container {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(14px);
      padding: 48px 40px;
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
      width: 100%;
      max-width: 360px;
    }

    .auth-container img {
      height: 56px;
      margin-bottom: 36px;
    }

    .google-btn {
      width: 100%;
      padding: 14px;
      border-radius: 999px;
      border: none;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      background: white;
      color: #1e3fa9;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .google-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.25);
    }

    .google-icon {
      width: 20px;
      height: 20px;
    }
  </style>
</head>
<body>

  <div class="auth-container">
    <!-- Voltz Logo -->
    <img src="logo.png" alt="Voltz Logo" />

    <!-- Google Sign In -->
    <button id="googleSignIn" class="google-btn">
      <img
        class="google-icon"
        src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
        alt="Google"
      />
      Sign in with Google
    </button>
  </div>

  <!-- ✅ FIREBASE (WORKING SETUP) -->
  <script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
  import {
    getAuth,
    GoogleAuthProvider,
    signInWithRedirect,
    getRedirectResult,
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyALYK8m7jg_Uz5W1A_-OiQu2RizkB2fBxg",
    authDomain: "voltz-auth-6351d.firebaseapp.com",
    projectId: "voltz-auth-6351d",
    storageBucket: "voltz-auth-6351d.firebasestorage.app",
    messagingSenderId: "757192216528",
    appId: "1:757192216528:web:79d7a6df8802397a2073d5"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const provider = new GoogleAuthProvider();

  // ✅ Handle redirect result (CRITICAL)
  getRedirectResult(auth)
    .then((result) => {
      if (result && result.user) {
        console.log("Signed in after redirect:", result.user);
        window.location.href = "/dashboard";
      }
    })
    .catch((error) => {
      console.error("Redirect error:", error);
    });

  // ✅ Fallback: if already signed in
  onAuthStateChanged(auth, (user) => {
    if (user) {
      window.location.href = "/dashboard";
    }
  });

  // Start Google sign-in
  document.getElementById("googleSignIn").addEventListener("click", () => {
    signInWithRedirect(auth, provider);
  });
</script>


</body>
</html>
